[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-sdd"
version = "0.1.0"
description = "Spec-Driven Development (SDD) for DeepSeek Harness - installs SDD skills, templates, constitution, and subagent prompts into a project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "krokrolabs" }]
keywords = ["spec-driven-development", "sdd", "deepseek-harness", "skills", "specification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/krokrolabs/spec-kit-deepseek-harness"
Source = "https://github.com/krokrolabs/spec-kit-deepseek-harness"
Issues = "https://github.com/krokrolabs/spec-kit-deepseek-harness/issues"

[project.scripts]
dsh-sdd = "dsh_sdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsh_sdd = ["skills/*/SKILL.md", "templates/*.md", "agents/*.md"]
