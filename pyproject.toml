[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-sdd"
version = "0.1.0"
description = "Spec-Driven Development (SDD) for DeepSeek Harness - installs SDD skills, templates, constitution, and subagent prompts into a project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NextSignal" }]
keywords = ["spec-driven-development", "sdd", "deepseek-harness", "skills", "specification"]

[project.scripts]
dsh-sdd = "dsh_sdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsh_sdd = ["skills/*/SKILL.md", "templates/*.md", "agents/*.md"]
